<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 >Demostracion de Output en Javascript</h1>
    <p id="texto">  </p>

    <button onclick="Alertausuario()"> Alerta </button>

    <button onclick="parrafoNuevo()">Parrafo </button>


<script>

    function Alertausuario(){

        alert("Hola soy carlos Guardado")
        
    }

    function parrafoNuevo(){

        document.getElementById("texto").innerHTML = "¡Texto actualizado con Javascript!"

    }

    window.addEventListener("load", () => {
    console.log("Estado del documento:", document.readyState);
    });
</script>
   
    
</body>



</html>
